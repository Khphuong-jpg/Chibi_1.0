function ac(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(f,d=.12,t='sine',v=.07,dl=0){const c=ac();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(c.destination);const st=c.currentTime+dl;g.gain.setValueAtTime(.0001,st);g.gain.linearRampToValueAtTime(v,st+.012);g.gain.exponentialRampToValueAtTime(.0001,st+d);o.start(st);o.stop(st+d+.03)}catch(e){}}

function initTapeDrag(){
const track=$('tapeTrack');if(!track)return;let dragging=false;
const update=cx=>{const r=track.getBoundingClientRect();let p=((cx-r.left)/r.width)*100;p=clamp(p,0,100);if(p>pack.tapeProgress){pack.tapeProgress=p;const fill=$('tapeFill'),roll=$('tapeRoll'),pct=$('tapePct');if(fill)fill.style.width=p+'%';if(roll)roll.style.left=`calc(${p}% - 20px)`;if(pct)pct.textContent=Math.floor(p)+'%';if(Math.random()<.25)SFX.tape();const strip=document.querySelector('#boxArea > div[style*="linear-gradient(90deg, rgba(255, 182, 193"]');if(strip)strip.style.width=p+'%';if(p>=100){SFX.ting();smallBoom(.5,.45);renderTools()}}};
track.addEventListener('pointerdown',e=>{dragging=true;track.setPointerCapture(e.pointerId);update(e.clientX)});
track.addEventListener('pointermove',e=>{if(dragging)update(e.clientX)});
track.addEventListener('pointerup',()=>{dragging=false});
track.addEventListener('pointercancel',()=>{dragging=false})}

lbl.addEventListener('pointermove',e=>{if(!dragging)return;lbl.style.left=(e.clientX-ox)+'px';lbl.style.top=(e.clientY-oy)+'px'});
const end=e=>{if(!dragging)return;dragging=false;lbl.style.transform='';lbl.style.boxShadow='';const br=$('boxArea').getBoundingClientRect();const inBox=e.clientX>=br.left&&e.clientX<=br.right&&e.clientY>=br.top&&e.clientY<=br.bottom;if(inBox){pack.labelPlaced=true;SFX.ting();boom(.6);renderAll()}else{lbl.style.position='';lbl.style.left='';lbl.style.top='';lbl.style.width='';lbl.style.zIndex=''}};

function openAlbum(){
const got=state.stickers.length;
const body=`<div class="text-center mb-4"><div class="text-[13px] font-black">Đã sưu tầm: ${got}/${STICKERS.length}</div><div class="bar mt-2"><i style="width:${(got/STICKERS.length)*100}%;background:linear-gradient(90deg,#FFB6C1,#BEB0EE)"></i></div></div><div class="grid grid-cols-3 sm:grid-cols-4 gap-2">${STICKERS.map(s=>{const owned=state.stickers.includes(s.id);return `<div class="card p-3 text-center ${owned?'':'opacity-40'}"><div class="text-4xl ${owned?'anim-float':''}">${owned?s.e:'❓'}</div><div class="text-[10px] font-black mt-2 leading-tight">${owned?s.n:'Chưa có'}</div></div>`}).join('')}</div><div class="mt-4 text-center text-[11px] font-bold opacity-60">Nhận sticker bí mật khi đạt đánh giá 5 ⭐ cho một đơn hàng!</div>`;
showModal('📖 Sổ Tay Sưu Tầm Sticker',body);SFX.click()}
let fpItems=[],fpSelected='🧸';
function openFreePlay(){
const palette=ITEMS.filter(i=>state.unlockedItems.includes(i.id));
showModal('🎨 Chế Độ Sáng Tạo',`<div class="text-[12px] font-bold opacity-70 mb-3">Bấm chọn một món, rồi bấm vào khung tranh để đặt vào hộp. Tải về để chia sẻ nhé!</div><div class="flex gap-1.5 flex-wrap mb-3" id="fpPalette">${palette.map(it=>`<button class="item-btn px-2 py-1.5 text-2xl" data-fpitem="${it.id}" style="${fpSelected===it.id?'border-color:#FFB6C1;background:rgba(255,209,220,.5)':''}">${it.e}</button>`).join('')}</div><canvas id="fpCanvas" width="640" height="640" class="w-full rounded-3xl cursor-crosshair" style="background:linear-gradient(160deg,#FFF8F0,#FFE9F2);border:4px dashed #FFD1DC"></canvas><div class="flex gap-2 mt-3 flex-wrap"><button class="btn btn-ghost flex-1" id="fpClear"><i class="fa-solid fa-trash"></i> Xoá hết</button><button class="btn btn-butter flex-1" id="fpRandom"><i class="fa-solid fa-shuffle"></i> Ngẫu nhiên</button><button class="btn btn-primary flex-1" id="fpDownload"><i class="fa-solid fa-download"></i> Tải Ảnh</button></div>`);
fpItems=[];drawFP();
$('fpPalette').addEventListener('click',e=>{const b=e.target.closest('[data-fpitem]');if(!b)return;fpSelected=b.dataset.fpitem;[...$('fpPalette').children].forEach(c=>{c.style.borderColor=c.dataset.fpitem===fpSelected?'#FFB6C1':'transparent';c.style.background=c.dataset.fpitem===fpSelected?'rgba(255,209,220,.5)':''});SFX.click()});
const cv=$('fpCanvas');
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(cv.width/r.width);const y=(e.clientY-r.top)*(cv.height/r.height);const meta=ITEMS.find(i=>i.id===fpSelected);fpItems.push({e:meta.e,x,y,rot:rnd(-.25,.25),size:64});SFX.pop();drawFP()});
$('fpClear').addEventListener('click',()=>{fpItems=[];drawFP();SFX.click()});
$('fpRandom').addEventListener('click',()=>{const p2=ITEMS.filter(i=>state.unlockedItems.includes(i.id));fpItems=[];for(let i=0;i<5+Math.floor(Math.random()*4);i++){const m=pick(p2);fpItems.push({e:m.e,x:rnd(90,550),y:rnd(90,550),rot:rnd(-.3,.3),size:rnd(50,80)})}SFX.pop();drawFP()});
$('fpDownload').addEventListener('click',()=>{const a=document.createElement('a');a.download=`tui-qua-cute-${Date.now()}.png`;a.href=$('fpCanvas').toDataURL('image/png');a.click();SFX.coin();toast('📸 Đã tải ảnh về máy!')})}
function drawFP(){
const cv=$('fpCanvas');if(!cv)return;const ctx=cv.getContext('2d');const W=cv.width,H=cv.height;
const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#FFF8F0');g.addColorStop(.5,'#FFE9F2');g.addColorStop(1,'#EAF6FF');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.save();ctx.strokeStyle='#FFB6C1';ctx.lineWidth=12;ctx.setLineDash([26,18]);roundRect(ctx,60,60,W-120,H-120,48);ctx.stroke();ctx.restore();
ctx.save();ctx.globalAlpha=.5;ctx.fillStyle='#FFD1DC';roundRect(ctx,60,60,W-120,90,40);ctx.fill();ctx.restore();
fpItems.forEach(it=>{ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.rot);ctx.font=`${it.size}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.e,0,0);ctx.restore()});
ctx.font='54px serif';ctx.textAlign='center';ctx.fillText('🎀',W/2,105);
ctx.font='900 26px Nunito, sans-serif';ctx.fillStyle='rgba(91,75,94,.55)';ctx.fillText('Tiệm Đóng Gói Chibi Cute 🧸',W/2,H-32)}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function openGuide(){
showModal('📖 Hướng Dẫn Chơi',`<div class="space-y-3 text-[13px] font-bold leading-relaxed">
<div class="card p-3"><div class="font-black text-[14px] mb-1">1️⃣ Nhận đơn</div>Khách hàng chibi sẽ đến với yêu cầu và thanh <b>kiên nhẫn</b>. Hết thời gian là khách bỏ đi đó!</div>
<div class="card p-3"><div class="font-black text-[14px] mb-1">2️⃣ Chọn hộp</div>Chọn hộp đủ lớn để chứa hết món. Hộp vừa khít sẽ được điểm cao hơn.</div>
<div class="card p-3"><div class="font-black text-[14px] mb-1">3️⃣ Xếp đồ</div>Bấm vào món trên kệ để cho vào hộp. Xếp đúng số lượng yêu cầu!</div>
<div class="card p-3"><div class="font-black text-[14px] mb-1">4️⃣ Trang trí</div>Thêm lớp lót chống sốc, viết thiệp cảm ơn để tăng tiền tip.</div>
<div class="card p-3"><div class="font-black text-[14px] mb-1">5️⃣ Dán băng keo & tem</div><b>Giữ và kéo ngang</b> trên thanh để dán băng keo đạt 100%. Sau đó dán tối đa 3 con tem.</div>
<div class="card p-3"><div class="font-black text-[14px] mb-1">6️⃣ Vận đơn</div><b>Kéo</b> tấm vận đơn thả vào hộp, rồi bấm vào mã QR 3 lần để quét.</div>
<div class="card p-3"><div class="font-black text-[14px] mb-1">7️⃣ Giao hàng</div>Chọn shipper phù hợp. Shipper xịn hơn = nhiều tip hơn nhưng tốn phí.</div>
<div class="card p-3" style="background:rgba(255,233,163,.55)"><div class="font-black text-[14px] mb-1">⭐ Đánh giá</div>Đạt <b>5 sao</b> sẽ nhận 💎 Kim Cương và 1 <b>Sticker bí mật</b>!</div>
<div class="card p-3" style="background:rgba(214,205,245,.55)"><div class="font-black text-[14px] mb-1">🐱 Nhân viên tự động</div>Thuê Mèo Méo Trợ Lý ở Cửa Hàng để có thu nhập thụ động khi AFK.</div>
<div class="card p-3" style="background:rgba(185,231,196,.55)"><div class="font-black text-[14px] mb-1">💾 Tự động lưu</div>Tiến trình được lưu tự động vào trình duyệt!</div>
</div>`);SFX.click()}
function openSettings(){
showModal('⚙️ Cài Đặt',`<div class="space-y-3">
<div class="card p-4"><div class="font-black text-[14px] mb-2">🎮 Chế độ ban đêm</div><button class="btn btn-lav w-full" onclick="toggleNight()"><i class="fa-solid fa-moon"></i> Bật / Tắt Night Shift</button></div>
<div class="card p-4"><div class="font-black text-[14px] mb-2">📤 Xuất dữ liệu</div><button class="btn btn-mint w-full" onclick="exportData()"><i class="fa-solid fa-file-export"></i> Tải file JSON</button></div>
<div class="card p-4"><div class="font-black text-[14px] mb-2">📥 Nhập dữ liệu</div><input type="file" id="importFile" accept=".json" class="w-full text-[11px] font-bold"/></div>
<div class="card p-4" style="background:rgba(255,209,220,.5)"><div class="font-black text-[14px] mb-2 text-red-600">⚠️ Nguy hiểm</div><button class="btn w-full" style="background:#FF8095;color:#fff" onclick="resetGame()"><i class="fa-solid fa-trash"></i> Xoá toàn bộ & chơi lại</button></div>
<div class="text-center text-[11px] font-bold opacity-50 pt-2">🧸 Tiệm Đóng Gói & Giao Hàng Chibi Cute<br>Made with 💕 · v1.0</div></div>`);
setTimeout(()=>{const f=$('importFile');if(f)f.addEventListener('change',ev=>{const file=ev.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const d=JSON.parse(e.target.result);state=Object.assign(defaultState(),d);save();applyDecor();applyNight();updateHUD();closeModal();startNewOrder();toast('📥 Nhập dữ liệu thành công!')}catch(err){toast('❌ File không hợp lệ!')}};reader.readAsText(file)})},50)}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`chibi-pack-save-${Date.now()}.json`;a.click();SFX.coin();toast('📤 Đã xuất dữ liệu!')}
function resetGame(){if(!confirm('Bạn chắc chắn muốn xoá toàn bộ tiến trình và chơi lại từ đầu?'))return;localStorage.removeItem(SAVE_KEY);state=defaultState();applyDecor();applyNight();closeModal();save();startNewOrder();toast('🔄 Đã reset game!')}
function toggleNight(){state.night=!state.night;applyNight();save();SFX.click()}
function applyNight(){document.body.classList.toggle('night',state.night);const btn=$('nightBtn');if(btn)btn.innerHTML=state.night?'<i class="fa-solid fa-sun"></i>':'<i class="fa-solid fa-moon"></i>'}
setInterval(()=>{if(state.autoPackers>0){const gain=state.autoPackers*4;state.money+=gain;state.dayStats.earned+=gain;updateHUD()}},1000);
setInterval(save,8000);
window.addEventListener('beforeunload',save);
(function init(){
const loaded=load();
applyDecor();applyNight();updateHUD();
if(loaded)toast('👋 Chào mừng trở lại tiệm!');else toast('🧸 Chào mừng đến Tiệm Đóng Gói Chibi!');
setTimeout(()=>{if(state.dayStats.orders>=ORDERS_PER_DAY)state.dayStats={earned:0,tips:0,stars:0,orders:0,perfect:0};startNewOrder()},400);
const unlock=()=>{ac();document.removeEventListener('pointerdown',unlock)};
document.addEventListener('pointerdown',unlock)})();
</script>
